name: Build koch OS ISO

on:
  workflow_dispatch:
    inputs:
      nvidia:
        description: "Include the NVIDIA proprietary driver (for NVIDIA GPUs)"
        type: boolean
        default: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force
          df -h /

      - name: Build ISO (Debian 13 container)
        run: |
          docker run --rm --privileged \
            -e KOCH_NVIDIA=${{ inputs.nvidia && '1' || '0' }} \
            -v "$PWD":/work -w /work debian:trixie \
            bash -c "apt-get update && apt-get install -y ca-certificates && bash build-koch-linux.sh"

      - name: Check result
        run: |
          sudo chmod a+r koch-linux-build/*.iso
          ls -lh koch-linux-build/*.iso

      - name: Upload ISO
        uses: actions/upload-artifact@v4
        with:
          name: koch-os-iso
          path: koch-linux-build/*.iso
          compression-level: 0
          retention-days: 7
